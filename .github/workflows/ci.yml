name: Quard
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.24"
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
      - run: uv sync --locked --group dev --python 3.12
      - run: mkdir -p /tmp/opencode
      - run: cargo test --locked --manifest-path rust/quard-clones/Cargo.toml
      - run: uv run --locked --group dev python -B -m unittest discover -s tests -v
      - run: git diff --exit-code
